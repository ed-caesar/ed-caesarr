<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ED CAESAR — Yönetim Paneli</title><style>
body{margin:0;background:#111;color:#eee;font:15px Arial,sans-serif}header{padding:24px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}h1,h2{font-family:Georgia,serif;font-weight:400}.brand{letter-spacing:4px}.wrap{max-width:1200px;margin:35px auto;padding:0 20px}.card{background:#191919;border:1px solid #333;padding:22px;margin-bottom:24px;border-radius:10px}input,select,button{padding:11px;border-radius:6px;border:1px solid #444;background:#222;color:#fff}input{width:100%;box-sizing:border-box}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #333}.muted{color:#aaa}.danger{border-color:#7d3030}.login{max-width:420px;margin:100px auto}.hidden{display:none}.pill{padding:5px 9px;border:1px solid #555;border-radius:20px;font-size:12px}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}.wrap{margin-top:15px}}
</style></head><body><header><div class="brand">ED CAESAR</div><button id="logout">Çıkış</button></header><main class="wrap"><section id="login" class="card login"><h1>Yönetici Girişi</h1><p class="muted">Admin anahtarını gir.</p><input id="key" type="password" placeholder="Admin anahtarı"><br><br><button id="loginBtn">Giriş yap</button><p id="loginErr"></p></section><section id="app" class="hidden"><div class="card"><h1>Mağaza Özeti</h1><div id="summary"></div></div><div class="card"><h2>Yeni ürün</h2><div class="grid"><input id="name" placeholder="Ürün adı"><input id="price" type="number" placeholder="Fiyat"><input id="category" placeholder="Kategori"><input id="stock" type="number" placeholder="Stok"></div><br><button id="add">Ürün ekle</button></div><div class="card"><h2>Ürünler</h2><div id="products"></div></div><div class="card"><h2>Siparişler</h2><div id="orders"></div></div></section></main><script>
const $=id=>document.getElementById(id); async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'İşlem başarısız');return d}
async function check(){try{await api('/api/admin/me');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').style.display='block';load()}catch{$('logout').style.display='none'}}
async function load(){const [p,o]=await Promise.all([api('/api/admin/products'),api('/api/admin/orders')]);$('summary').innerHTML=`${p.length} ürün · ${o.length} sipariş · <strong>${o.filter(x=>x.status==='paid').length} ödenmiş</strong>`;$('products').innerHTML=p.map(x=>`<div class="row"><div><strong>${x.name}</strong><br><span class="muted">${x.category} · ${x.active?'Yayında':'Gizli'}</span></div><input data-p="price" data-id="${x.id}" value="${x.price}"><input data-p="stock" data-id="${x.id}" value="${x.stock}"><button onclick="toggle('${x.id}',${!x.active})">${x.active?'Gizle':'Yayınla'}</button><button class="danger" onclick="del('${x.id}')">Sil</button></div>`).join('');$('orders').innerHTML=o.length?o.slice().reverse().map(x=>`<div class="row"><div><strong>${x.id}</strong><br>${x.customer.name} · ${x.customer.phone}<br><span class="muted">${x.total.toLocaleString('tr-TR')} ₺</span></div><div>${x.status}</div><div></div><select onchange="status('${x.id}',this.value)">${['payment_pending','paid','preparing','shipped','completed','cancelled'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><button onclick="alert('${x.customer.address.replace(/'/g,"\\'")}')">Adres</button></div>`).join(''):'<p class="muted">Henüz sipariş yok.</p>'}
$('loginBtn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({key:$('key').value})});check()}catch(e){$('loginErr').textContent=e.message}};$('add').onclick=async()=>{await api('/api/admin/products',{method:'POST',body:JSON.stringify({name:$('name').value,price:Number($('price').value),category:$('category').value,stock:Number($('stock').value)})});['name','price','category','stock'].forEach(x=>$(x).value='');load()};$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};
window.toggle=async(id,active)=>{await api('/api/admin/products/'+id,{method:'PATCH',body:JSON.stringify({active})});load()};window.del=async id=>{if(confirm('Ürün silinsin mi?')){await api('/api/admin/products/'+id,{method:'DELETE'});load()}};window.status=async(id,status)=>{await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});load()};check();
</script></body></html>
